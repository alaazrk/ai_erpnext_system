[project]
name = "erp_ai"
authors = [
    { name = "hw", email = "alaa@hw.com" },
]
description = "ERPNext AI Platform - assistant IA local pour ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "requests",
    "pypdf",
    "python-docx",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
